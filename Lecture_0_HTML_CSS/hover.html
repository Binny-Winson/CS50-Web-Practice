<!DOCTYPE html>
<html>
  <head>
    <title>
      Pseudoclasses
    </title>
    <style>
      button {
        background-color: red;
        font-size: 24px;
        width: 200px;
        height: 50px;
        margin: 20px;
        border: none;
      }
      button:hover {
        background-color: green;
      }
    </style>
  </head>
  <body>
    <button>Button 1</button>
    <button>Button 2</button>
    <button>Button 3</button>
  </body>
</html>
