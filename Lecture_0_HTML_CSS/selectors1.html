<!-- Attributes as Selectors: We can also narrow down our selection based on the attributes we assign to HTML elements using brackets.-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Using Selectors</title>
  <style>
    li [href="https://www.amazon.com/"] {
      color: red;
    }
  </style>
</head>
<body>
  <ol>
    <li><a href="https://www.google.com/">Google</a></li>
    <li><a href="https://www.amazon.com/">Amazon</a></li>
    <li><a href="https://www.facebook.com/">Facebook</a></li>
  </ol>
</body>
</html>
