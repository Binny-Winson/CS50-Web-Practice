<!DOCTYPE html>
<html>
  <head>
    <title>HTML Elements</title>
  </head>
  <body>
    <h1 style="font-weight: bold;">A Large Heading</h1>
    <h3 style="font-weight: bold;">A Smaller Heading</h3>
    <h6 style="font-weight: bold;">The Smallest Heading</h6>

    <p>A <strong>bold</strong> word and an <i>italicized</i> word!</p>
    View the<a href="https://cs50.harvard.edu/", alt = "CS50Website">CS50Website!</a>

    An unordered list:
    <ul>
      <li>foo</li>
      <li>bar</li>
      <li>baz</li>
    </ul>

    An ordered list
    <ol>
      <li>foo</li>
      <li>bar</li>
      <li>baz</li>
    </ol>

    An Image <img src="cs50 duck.jpg", alt="Duck Image">
    <br/> <br/>

    <table>
      <thead>
        <th>Ocean</th>
        <th>Average Depth</th>
        <th>Maximum Depth</th>
      </thead>
      <tbody>
        <tr>
          <td>Pacific</td>
          <td>4280 m</td>
          <td>10911 m</td>
        </tr>
        <tr>
          <td>Atlantic</td>
          <td>3646 m</td>
          <td>8486 m</td>
        </tr>
      </tbody>
    </table>

  </body>
</html>
